version: '3.8'

services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile.code-server
    container_name: showcase-ide
    restart: unless-stopped
    ports:
      - "3001:8080"
    volumes:
      # 挂载项目根目录 (只读)
      - .:/home/coder/project:ro
      # 屏蔽敏感文件 (.env 显示为 .env.local.example 的内容)
      - ./.env.local.example:/home/coder/project/.env:ro
      # 持久化用户数据
      - code_server_data:/home/coder/.local/share/code-server
    environment:
      - DOCKER_USER=coder
    command: >
      --auth none --bind-addr 0.0.0.0:8080 /home/coder/project
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  code_server_data:
